name: Build nRF52 Firmwares

on:
  push:
    branches: [ master ]

env:
  SDCC_ARCHIVE: /tmp/sdcc-4.0.0-amd64-unknown-linux2.5.tar.bz2
  GCC_ARM_ARCHIVE: /tmp/gcc-arm-none-eabi-7-2018-q2-update-linux.tar.bz2
  NRF_SDK_ARCHIVE: /tmp/nRF5_SDK_15.3.0_59ac345.zip
  NRF_CLI_ARCHIVE: /tmp/nrf-command-line-tools.tar.gz

jobs:
  build:
    name: Build
    runs-on: ubuntu-22.04
    steps:
    - name: Download nrf52-keyboard
      uses: actions/checkout@v6
      with:
        repository: Lotlab/nrf52-keyboard
        ref: master
        submodules: recursive
    - name: Download custom keymap
      uses: actions/checkout@v6
      with:
        path: keyboard/custom-keymap
    - name: Cache SDCC
      id: cache-sdcc
      uses: actions/cache@v5
      env:
        cache-name: cache-sdcc
      with:
        path: ${{ env.SDCC_ARCHIVE }}
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
    - name: Cache GCC ARM
      id: cache-gcc-arm
      uses: actions/cache@v5
      env:
        cache-name: cache-gcc-arm
      with:
        path: ${{ env.GCC_ARM_ARCHIVE }}
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
    - name: Cache nRF SDK
      id: cache-nrf-sdk
      uses: actions/cache@v5
      env:
        cache-name: cache-nrf-sdk
      with:
        path: ${{ env.NRF_SDK_ARCHIVE }}
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
    - name: Cache nRF CLI
      id: cache-nrf-cli
      uses: actions/cache@v5
      env:
        cache-name: cache-nrf-cli
      with:
        path: ${{ env.NRF_CLI_ARCHIVE }}
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('**/.github/workflows/build.yml') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ env.cache-name }}-
    - if: ${{ steps.cache-sdcc.outputs.cache-hit != 'true' }}
      name: Download SDCC
      continue-on-error: true
      run: wget https://sourceforge.net/projects/sdcc/files/sdcc-linux-amd64/4.0.0/sdcc-4.0.0-amd64-unknown-linux2.5.tar.bz2 -O "${SDCC_ARCHIVE}"
    - if: ${{ steps.cache-gcc-arm.outputs.cache-hit != 'true' }}
      name: Download GCC ARM
      continue-on-error: true
      run: wget https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu-rm/7-2018q2/gcc-arm-none-eabi-7-2018-q2-update-linux.tar.bz2 -O "${GCC_ARM_ARCHIVE}"
    - if: ${{ steps.cache-nrf-sdk.outputs.cache-hit != 'true' }}
      name: Download nRF SDK
      continue-on-error: true
      run: wget https://files.nordicsemi.com/artifactory/nRF5-SDK/external/nRF5_SDK_v15.x.x/nRF5_SDK_15.3.0_59ac345.zip -O "${NRF_SDK_ARCHIVE}"
    - if: ${{ steps.cache-nrf-cli.outputs.cache-hit != 'true' }}
      name: Download nRF CLI
      continue-on-error: true
      run: wget https://nsscprodmedia.blob.core.windows.net/prod/software-and-other-downloads/desktop-software/nrf-command-line-tools/sw/versions-10-x-x/10-19-0/nrf-command-line-tools-10.19.0_linux-amd64.tar.gz -O "${NRF_CLI_ARCHIVE}"
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get -y install python3-pip python3-setuptools
        sudo pip3 install --upgrade pip
        sudo pip3 install nrfutil
        tar xf "${SDCC_ARCHIVE}" -C /tmp
        sudo cp -r /tmp/sdcc-4.0.0/* /usr/local
        tar xf "${GCC_ARM_ARCHIVE}" -C /tmp
        mkdir /tmp/sdk
        unzip -q "${NRF_SDK_ARCHIVE}" -d /tmp/sdk
        mkdir /tmp/tools
        tar xf "${NRF_CLI_ARCHIVE}" -C /tmp/tools
        sudo cp -r /tmp/tools/nrf-command-line-tools/bin/mergehex /opt
        sudo ln -s /opt/mergehex /usr/local/bin/mergehex
        cp -r /tmp/sdk/nRF5_SDK_15.3.0_59ac345/* SDK/
        cp template/Makefile.posix.template template/Makefile.posix
        sed -i "s/\/usr\/local/\/tmp/g" template/Makefile.posix
        cp template/Makefile.posix SDK/components/toolchain/gcc/Makefile.posix
        cd SDK/external/micro-ecc/nrf52hf_armgcc/armgcc/ && make
        cd ../../nrf52nf_armgcc/armgcc/ && make
        cd ../../../../../
        rm -r tmk/tmk_core/protocol/usb_hid/USB_Host_Shield_2.0-tmk/
        cd tmk/ && git reset --hard
        cd ../
    - name: Build firmwares
      shell: sh -x {0}
      run: |
        cd keyboard/custom-keymap
        make go
    - name: Collect artifacts
      shell: sh -x {0}
      run: |
        mkdir _artifacts
        if [ -e keyboard/custom-keymap/_build/ch554.bin ]
        then
          cp keyboard/custom-keymap/_build/ch554.bin _artifacts/ch554.bin
        fi
        if [ -e keyboard/custom-keymap/_build/nrf52_all.hex ]
        then
          cp keyboard/custom-keymap/_build/nrf52_all.hex _artifacts/nrf52_all.hex
        fi
        if [ -e keyboard/custom-keymap/_build/nrf52_kbd_*.zip ]
        then
          cp keyboard/custom-keymap/_build/nrf52_kbd_*.zip _artifacts/nrf52_ota.zip
        fi
    - name: Upload package
      uses: actions/upload-artifact@v7
      with:
        name: nrf52
        path: _artifacts
